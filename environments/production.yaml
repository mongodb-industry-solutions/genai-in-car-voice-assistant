# Production Environment Configuration for GenAI In-Car Voice Assistant
# Kanopy Deployment - Industry Solutions

# Service Account Configuration (GCP Workload Identity)
serviceAccount:
  enabled: true
  name: genai-car-va-sa-prod  # Production K8s SA

# Mount GCP credential config and service account token (PRODUCTION)
extraVolumes:
  - name: gcp-creds
    configMap:
      name: gcp-wif-config-prod
  - name: gcp-token
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
          audience: "//iam.googleapis.com/projects/362614368442/locations/global/workloadIdentityPools/kanopy-mfg-wif-pool-prod/providers/kanopy-mfg-provider-prod"

extraVolumeMounts:
  - name: gcp-creds
    mountPath: /etc/gcp
    readOnly: true
  - name: gcp-token
    mountPath: /var/run/service-account
    readOnly: true

# Environment variables
env:
  NODE_ENV: production

  # GCP Configuration
  GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credential-configuration.json
  GCP_PROJECT_ID: manufacturing-project-425012
  GCP_LOCATION: us-central1
  # Stop GCP client libs (google-auth-library/gcp-metadata) from probing the
  # link-local metadata endpoint 169.254.169.254 — same IP as AWS IMDS.
  # All GCP auth comes from the mounted WIF file, so the metadata probe is pure
  # redundant auto-detection. Kanopy IMDS "Deny by Default" cutover.
  GOOGLE_CLOUD_PROJECT: manufacturing-project-425012  # removes getProjectId() metadata path
  METADATA_SERVER_DETECTION: none                      # hard-stops the metadata availability probe

  # Vertex AI Configuration
  VERTEXAI_COMPLETIONS_MODEL: gemini-2.5-flash
  VERTEXAI_EMBEDDINGS_MODEL: text-embedding-005

  # Frontend Configuration
  NEXT_PUBLIC_ENV: production

# Secrets (stored in Kubernetes via helm ksec)
envSecrets:
  # MongoDB Configuration
  MONGODB_URI: genai-in-car-va-secrets-prod
  DATABASE_NAME: genai-in-car-va-secrets-prod

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: javier.guajardo@mongodb.com
